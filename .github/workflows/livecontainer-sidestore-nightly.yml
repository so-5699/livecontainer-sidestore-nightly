name: LiveContainer + SideStore (LC-support + upstream CoreData sync)

on:
  workflow_dispatch:
  schedule:
    # Every day at 23:00 UTC = 08:00 JST (next day)
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    env:
      scheme: LiveContainer
      archive_path: archive

      # LiveContainer team's LC-adapted branch (base).
      SIDESTORE_LC_REF: LiveContainerSupport

      # Upstream SideStore branch that we selectively sync from.
      SIDESTORE_UPSTREAM_BRANCH: develop

      # Paths we care about for Core Data / AltStoreCore.
      # Multiple entries can be added; missing ones are skipped safely.
      SIDESTORE_SYNC_PATHS: |
        AltStoreCore
        AltStore/Models
        AltStoreCore/Models

    steps:
      # ============================================================
      # 1. LiveContainer
      # ============================================================
      - name: LiveContainer最新版をチェックアウト
        uses: actions/checkout@v4
        with:
          repository: LiveContainer/LiveContainer
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: LiveContainerのコミット情報を表示
        shell: bash
        run: |
          set -euo pipefail
          echo "LiveContainer commit:"
          git rev-parse HEAD
          git log -1 --oneline

      # ============================================================
      # 2. Xcode
      # ============================================================
      - name: Xcodeをセットアップ
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Xcodeバージョンを表示
        run: xcodebuild -version

      # ============================================================
      # 3. Detect LiveContainer Xcode project
      # ============================================================
      - name: Xcodeプロジェクト/ワークスペースを判定
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "LiveContainer.xcworkspace/contents.xcworkspacedata" ]; then
            echo "filetype_parameter=workspace" >> "$GITHUB_OUTPUT"
            echo "file_to_build=LiveContainer.xcworkspace" >> "$GITHUB_OUTPUT"
          elif [ -f "LiveContainer.xcodeproj/project.pbxproj" ]; then
            echo "filetype_parameter=project" >> "$GITHUB_OUTPUT"
            echo "file_to_build=LiveContainer.xcodeproj" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Could not find LiveContainer Xcode project/workspace."
            exit 1
          fi

      # ============================================================
      # 4. Build LiveContainer
      # ============================================================
      - name: LiveContainerをアーカイブ
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -"${{ steps.xcode.outputs.filetype_parameter }}" \
            "${{ steps.xcode.outputs.file_to_build }}" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcbeautify

      # ============================================================
      # 5. Install tools
      # ============================================================
      - name: 依存ツールをインストール
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid xcbeautify

      # ============================================================
      # 6. Get SideStore: LC branch as base
      # ============================================================
      - name: LiveContainerSupport版SideStoreを取得
        uses: actions/checkout@v4
        with:
          repository: LiveContainer/SideStore
          ref: ${{ env.SIDESTORE_LC_REF }}
          submodules: recursive
          fetch-depth: 0
          path: sidestore

      - name: SideStore upstream developを追加
        shell: bash
        working-directory: sidestore
        run: |
          set -euo pipefail

          git remote -v

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/SideStore/SideStore.git
          else
            git remote add upstream https://github.com/SideStore/SideStore.git
          fi

          git fetch upstream "${SIDESTORE_UPSTREAM_BRANCH}" --prune

          echo "=== LC branch ==="
          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "=== Upstream ==="
          git rev-parse "upstream/${SIDESTORE_UPSTREAM_BRANCH}"
          git log -1 --oneline "upstream/${SIDESTORE_UPSTREAM_BRANCH}"

      # ============================================================
      # 7. Show diff in Core Data / AltStoreCore area
      # ============================================================
      - name: Core Data / AltStoreCore 差分を可視化
        shell: bash
        working-directory: sidestore
        run: |
          set -euo pipefail

          BASE=$(git merge-base HEAD "upstream/${SIDESTORE_UPSTREAM_BRANCH}")
          echo "Merge base: $BASE"
          git log -1 --oneline "$BASE"

          echo
          echo "=== Directory layout (top level) ==="
          ls -la

          echo
          echo "=== *.xcdatamodeld locations ==="
          find . -name "*.xcdatamodeld" -not -path "./.git/*" -print || true

          echo
          echo "=== AltStoreCore* locations ==="
          find . -iname "AltStoreCore*" -not -path "./.git/*" -print || true

          echo
          echo "=== Files changed upstream in AltStoreCore-ish paths ==="
          git diff --stat "$BASE" "upstream/${SIDESTORE_UPSTREAM_BRANCH}" -- \
            AltStoreCore AltStore/Models AltStoreCore/Models '*.xcdatamodeld' 2>/dev/null || true

      # ============================================================
      # 8. Selectively sync only Core Data / AltStoreCore files
      #
      # Rule:
      #   - If upstream changed a file and LC branch did NOT modify it
      #     since the merge base, take upstream's version.
      #   - If both modified it, keep LC's version (LC adaptation wins).
      #
      # This avoids a full `git merge` (which would conflict on the
      # Xcode project and other LC-specific overrides) while still
      # picking up upstream fixes in the Core Data layer.
      # ============================================================
      - name: Core Data / AltStoreCoreを選択的に取り込み
        shell: bash
        working-directory: sidestore
        run: |
          set -euo pipefail

          BASE=$(git merge-base HEAD "upstream/${SIDESTORE_UPSTREAM_BRANCH}")

          # Build list of paths, skipping ones that don't exist locally.
          PATHS=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [ -e "$line" ]; then
              PATHS+=("$line")
            else
              echo "skip (not present): $line"
            fi
          done <<< "$SIDESTORE_SYNC_PATHS"

          # Also always include any *.xcdatamodeld found anywhere.
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            PATHS+=("$d")
          done < <(find . -name "*.xcdatamodeld" -not -path "./.git/*" -print)

          if [ ${#PATHS[@]} -eq 0 ]; then
            echo "No sync paths found. Using LC branch as-is."
          fi

          printf 'Sync paths:\n'
          for p in "${PATHS[@]}"; do printf '  %s\n' "$p"; done

          # Files LC changed since base (within these paths)
          LC_CHANGED=$(git diff --name-only "$BASE" HEAD -- "${PATHS[@]}" || true)
          # Files upstream changed since base (within these paths)
          UP_CHANGED=$(git diff --name-only "$BASE" "upstream/${SIDESTORE_UPSTREAM_BRANCH}" -- "${PATHS[@]}" || true)

          echo
          echo "=== LC-changed files in scope ==="
          echo "$LC_CHANGED"

          echo
          echo "=== Upstream-changed files in scope ==="
          echo "$UP_CHANGED"

          echo
          echo "=== Applying upstream-only changes ==="

          if [ -z "$UP_CHANGED" ]; then
            echo "No upstream changes in scope."
          fi

          # Use a temp file to iterate safely
          printf '%s\n' "$UP_CHANGED" > /tmp/up_changed.txt
          printf '%s\n' "$LC_CHANGED" > /tmp/lc_changed.txt

          while IFS= read -r F; do
            [ -z "$F" ] && continue

            if grep -qxF "$F" /tmp/lc_changed.txt; then
              echo "KEEP   (LC-modified): $F"
            else
              echo "TAKE   (upstream)  : $F"
              # Handles new files too
              git checkout "upstream/${SIDESTORE_UPSTREAM_BRANCH}" -- "$F" || {
                echo "WARN: checkout failed for $F (may have been deleted upstream)"
              }
            fi
          done < /tmp/up_changed.txt

          echo
          echo "=== git status after selective sync ==="
          git status --short

      - name: 選択取り込み後の状態を確認
        shell: bash
        working-directory: sidestore
        run: |
          set -euo pipefail

          echo "=== .xcdatamodeld present ==="
          find . -name "*.xcdatamodeld" -not -path "./.git/*" -print

          echo
          echo "=== Core Data model version hash info ==="
          while IFS= read -r d; do
            echo "--- $d ---"
            ls -la "$d" || true
          done < <(find . -name "*.xcdatamodeld" -not -path "./.git/*" -print)

      # ============================================================
      # 9. Build SideStore from source (includes AltStoreCore)
      # ============================================================
      - name: SideStoreをソースからビルド
        shell: bash
        working-directory: sidestore
        run: |
          set -euo pipefail

          # Discover project/scheme (AltStore.xcodeproj / SideStore scheme)
          test -d AltStore.xcodeproj

          rm -rf SideStore.xcarchive

          xcodebuild \
            -project AltStore.xcodeproj \
            -scheme SideStore \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./SideStore.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # ============================================================
      # 10. Package SideStore IPA
      # ============================================================
      - name: SideStore IPAを生成
        shell: bash
        working-directory: sidestore
        run: |
          set -euo pipefail

          rm -rf Payload
          mkdir -p Payload

          cp -R SideStore.xcarchive/Products/Applications/SideStore.app Payload/SideStore.app

          rm -f SideStore.ipa
          (
            cd Payload
            zip -qr ../SideStore.ipa SideStore.app \
              -x "._*" -x ".DS_Store" -x "__MACOSX"
          )

          ls -lh SideStore.ipa

      # ============================================================
      # 11. CRITICAL: Verify AltStoreCore + Core Data in built app
      #
      # This is the check that the previous nightly IPA failed.
      # ============================================================
      - name: ビルド済みSideStoreにAltStoreCore/CoreDataがあるか検証
        shell: bash
        working-directory: sidestore
        run: |
          set -euo pipefail

          rm -rf verify
          mkdir verify
          unzip -q SideStore.ipa -d verify

          APP="verify/SideStore.app"
          test -d "$APP"
          test -f "$APP/SideStore"

          echo "=== Top-level SideStore.app ==="
          ls -la "$APP"

          echo
          echo "=== AltStoreCore* inside SideStore.app ==="
          find "$APP" -iname "AltStoreCore*" -print || true

          echo
          echo "=== *.momd inside SideStore.app ==="
          find "$APP" \( -name "*.momd" -o -name "*.mom" \) -print

          # 1. .momd must exist somewhere in the app
          if ! find "$APP" \( -name "*.momd" -o -name "*.mom" \) -print -quit | grep -q .; then
            echo "ERROR: No Core Data models in built SideStore.app"
            exit 1
          fi

          # 2. AltStoreCore.{framework,bundle} must exist
          if ! find "$APP" -iname "AltStoreCore.framework" -o -iname "AltStoreCore.bundle" -print -quit | grep -q .; then
            echo "ERROR: AltStoreCore.framework/.bundle missing from built SideStore.app"
            echo "This would cause:"
            echo '  AltStoreCore bundle not found'
            echo '  Failed to load model AltStore from AltStoreCore bundle'
            echo '  Code=-23'
            exit 1
          fi

          echo
          echo "=== Info.plist (SideStore.app) ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"

          echo
          echo "=== AltStoreCore Info.plist (if framework) ==="
          CORE=$(find "$APP" -iname "AltStoreCore.framework" -type d -print -quit || true)
          if [ -n "$CORE" ] && [ -f "$CORE/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$CORE/Info.plist" || true
          fi

      # ============================================================
      # 12. Place SideStore IPA where build_github.sh expects it
      # ============================================================
      - name: 統合用SideStore IPAを配置
        shell: bash
        run: |
          set -euo pipefail
          cp sidestore/SideStore.ipa ./SideStore.ipa
          ls -lh ./SideStore.ipa

      # ============================================================
      # 13. Patch build_github.sh: use local IPA instead of download
      # ============================================================
      - name: LiveContainer統合スクリプトをローカルSideStore用に変更
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT=".github/build_github.sh"
          test -f "$SCRIPT"
          test -f "SideStore.ipa"

          echo "=== Original SideStore-related lines ==="
          grep -n "SideStore.ipa" "$SCRIPT" || true

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(".github/build_github.sh")
          text = path.read_text()

          pattern = re.compile(
              r"(?m)^[^\n]*(?:wget|curl)[^\n]*SideStore\.ipa[^\n]*$"
          )
          matches = list(pattern.finditer(text))
          if not matches:
              raise SystemExit(
                  "ERROR: Could not locate SideStore download command."
              )

          def repl(_m):
              return (
                  'test -f SideStore.ipa\n'
                  'echo "Using locally built SideStore.ipa"\n'
                  'ls -lh SideStore.ipa'
              )

          new_text, count = pattern.subn(repl, text, count=1)
          path.write_text(new_text)
          print(f"Patched {count} command(s).")
          PY

          echo
          echo "=== Patched lines ==="
          grep -n -A2 -B2 "Using locally built SideStore" "$SCRIPT"

          if grep -E "(wget|curl).*SideStore\.ipa" "$SCRIPT"; then
            echo "ERROR: Remote download still present."
            exit 1
          fi

      # ============================================================
      # 14. Run LC integration script
      # ============================================================
      - name: 公式LiveContainer統合処理を実行
        shell: bash
        run: |
          set -euo pipefail
          sh .github/build_github.sh

      # ============================================================
      # 15. Verify final IPA (with AltStoreCore!)
      # ============================================================
      - name: 生成された統合版IPAを確認
        shell: bash
        run: |
          set -euo pipefail
          test -f "LiveContainer+SideStore.ipa"
          ls -lh "LiveContainer+SideStore.ipa"

      - name: 統合版IPAを展開
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-final
          mkdir -p verify-final
          unzip -q "LiveContainer+SideStore.ipa" -d verify-final

      - name: 【重要】AltStoreCore/CoreDataを最終IPAで検証
        shell: bash
        run: |
          set -euo pipefail

          APP="verify-final/Payload/LiveContainer.app"
          FW="$APP/Frameworks/SideStoreApp.framework"

          echo "=== SideStoreApp.framework top-level ==="
          find "$FW" -maxdepth 2 -print | sort

          echo
          echo "=== AltStoreCore* anywhere in LiveContainer.app ==="
          find "$APP" -iname "AltStoreCore*" -print || true

          echo
          echo "=== *.momd anywhere in LiveContainer.app ==="
          find "$APP" \( -name "*.momd" -o -name "*.mom" \) -print

          echo
          echo "=== strings: AltStoreCore references in SideStore binary ==="
          strings "$FW/SideStore" | grep -iE "AltStoreCore|com\.sidestore|com\.altstore" | sort -u | head -40 || true

          # CRITICAL check: AltStoreCore must exist in final IPA
          if ! find "$APP" \( -iname "AltStoreCore.framework" -o -iname "AltStoreCore.bundle" \) -print -quit | grep -q .; then
            echo
            echo "FATAL: AltStoreCore.framework/.bundle is MISSING in final IPA."
            echo "This WILL cause:"
            echo '  AltStoreCore bundle not found'
            echo '  Failed to load model AltStore from AltStoreCore bundle'
            echo '  io.sidestore.PersistentContainer Code=-23'
            exit 1
          fi

          # And .momd must exist somewhere under AltStoreCore
          CORE=$(find "$APP" \( -iname "AltStoreCore.framework" -o -iname "AltStoreCore.bundle" \) -type d -print -quit)
          if ! find "$CORE" \( -name "*.momd" -o -name "*.mom" \) -print -quit | grep -q .; then
            echo "FATAL: $CORE has no .momd"
            find "$CORE" -print
            exit 1
          fi

          echo
          echo "AltStoreCore / Core Data presence verified in final IPA."

      # ============================================================
      # 16. Other final validations
      # ============================================================
      - name: SideStore frameworkを検証
        shell: bash
        run: |
          set -euo pipefail
          FW="verify-final/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework"
          test -d "$FW"
          test -f "$FW/SideStore"

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier"        "$FW/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$FW/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion"            "$FW/Info.plist"

      - name: LiveWidgetExtensionを検証
        shell: bash
        run: |
          set -euo pipefail
          WIDGET="verify-final/Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex"
          test -d "$WIDGET"
          test -f "$WIDGET/LiveWidgetExtension"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WIDGET/Info.plist")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$WIDGET/Info.plist")
          echo "Widget ID: $BUNDLE_ID  exec: $EXECUTABLE"

      # ============================================================
      # 17. SHA256 + build info
      # ============================================================
      - name: SHA256を計算
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 "LiveContainer+SideStore.ipa"

      - name: ビルド情報を作成
        shell: bash
        run: |
          set -euo pipefail

          FW_INFO="verify-final/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/Info.plist"

          {
            echo "LiveContainer + SideStore (LC-support + upstream CoreData sync)"
            echo
            echo "## LiveContainer"
            git rev-parse HEAD
            git log -1 --oneline
            echo
            echo "## Xcode"
            xcodebuild -version
            echo
            echo "## SideStore LC branch"
            cd sidestore
            git rev-parse HEAD
            git log -1 --oneline
            echo
            echo "## SideStore upstream ${SIDESTORE_UPSTREAM_BRANCH}"
            git rev-parse "upstream/${SIDESTORE_UPSTREAM_BRANCH}"
            git log -1 --oneline "upstream/${SIDESTORE_UPSTREAM_BRANCH}"
            echo
            echo "## Merge base"
            git merge-base HEAD "upstream/${SIDESTORE_UPSTREAM_BRANCH}"
            echo
            cd ..
            echo "## Embedded SideStore"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier"        "$FW_INFO"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$FW_INFO"
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion"            "$FW_INFO"
            echo
            echo "## SHA256"
            shasum -a 256 "LiveContainer+SideStore.ipa"
          } > build-info.txt

          cat build-info.txt

      # ============================================================
      # 18. Upload
      # ============================================================
      - name: LiveContainer + SideStore IPAをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-plus-SideStore
          path: LiveContainer+SideStore.ipa
          if-no-files-found: error
          retention-days: 7

      - name: ビルド情報をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt
          if-no-files-found: error
          retention-days: 7

      - name: ジョブサマリーを出力
        shell: bash
        run: |
          {
            echo "## LiveContainer + SideStore"
            echo
            echo "### LiveContainer"
            echo '```'
            git log -1 --oneline
            echo '```'
            echo
            echo "### Build information"
            echo '```'
            cat build-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
