name: LiveContainer + SideStore Nightly

on:
  workflow_dispatch:

  schedule:
    # 23:00 UTC = 08:00 JST
    - cron: "0 23 * * *"

permissions:
  contents: read

concurrency:
  group: livecontainer-sidestore-nightly
  cancel-in-progress: true

jobs:
  build:
    name: Build LiveContainer + SideStore
    runs-on: macos-latest

    env:
      LC_REPO: LiveContainer/LiveContainer
      LC_BRANCH: main

      # IMPORTANT
      #
      # LiveContainer's built-in SideStore integration is based on
      # the LiveContainer/SideStore fork.
      #
      # Do NOT replace this with SideStore/SideStore here.
      SIDESTORE_URL: https://github.com/LiveContainer/SideStore/releases/download/nightly/SideStore.ipa

      OUTPUT_IPA: LiveContainer+SideStore.ipa

    steps:

      # ============================================================
      # 1. Checkout LiveContainer
      # ============================================================

      - name: Checkout LiveContainer
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LC_REPO }}
          ref: ${{ env.LC_BRANCH }}
          fetch-depth: 1

      # ============================================================
      # 2. Xcode
      # ============================================================

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Xcode installations ==="
          ls -1 /Applications | grep '^Xcode' || true

          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          fi

          echo
          echo "=== Selected Xcode ==="
          xcode-select -p
          xcodebuild -version

      # ============================================================
      # 3. Install tools
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          brew install ldid

          echo "=== ldid ==="
          ldid -V || true

      # ============================================================
      # 4. Download SideStore
      # ============================================================

      - name: Download LiveContainer-compatible SideStore Nightly
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/sidestore"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --output "$RUNNER_TEMP/sidestore/SideStore.ipa" \
            "$SIDESTORE_URL"

          test -s "$RUNNER_TEMP/sidestore/SideStore.ipa"

          echo "=== SideStore SHA256 ==="
          shasum -a 256 "$RUNNER_TEMP/sidestore/SideStore.ipa"

      # ============================================================
      # 5. Extract SideStore
      # ============================================================

      - name: Extract SideStore
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/sidestore/extracted"

          mkdir -p "$RUNNER_TEMP/sidestore/extracted"

          unzip -q \
            "$RUNNER_TEMP/sidestore/SideStore.ipa" \
            -d "$RUNNER_TEMP/sidestore/extracted"

          APP="$RUNNER_TEMP/sidestore/extracted/Payload/SideStore.app"

          if [ ! -d "$APP" ]; then
            echo "::error::SideStore.app was not found."
            exit 1
          fi

          echo "SideStore.app:"
          echo "$APP"

      # ============================================================
      # 6. Preflight Core Data
      #
      # Prevents the known:
      #
      #   NSPersistentContainer Code=-23
      #   Unable to find any managed object models
      #
      # class of failure.
      # ============================================================

      - name: Validate SideStore Core Data resources
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/sidestore/extracted/Payload/SideStore.app"

          echo "=== Core Data resources ==="

          find "$APP" \
            \( -name "*.mom" -o -name "*.momd" \) \
            -print \
            | sort

          MODEL_COUNT=$(
            find "$APP" \
              \( -name "*.mom" -o -name "*.momd" \) \
              -print \
              | wc -l \
              | tr -d ' '
          )

          echo
          echo "Model count: $MODEL_COUNT"

          if [ "$MODEL_COUNT" -eq 0 ]; then
            echo "::error::No Core Data .mom/.momd resources found."
            exit 1
          fi

          echo
          echo "=== AltStore model ==="

          find "$APP" \
            \( -name "AltStore.mom" -o -name "AltStore.momd" \) \
            -print

          if ! find "$APP" \
            \( -name "AltStore.mom" -o -name "AltStore.momd" \) \
            | grep -q .; then

            echo "::error::AltStore Core Data model is missing."
            exit 1
          fi

      # ============================================================
      # 7. Validate AltStoreCore
      #
      # This is the important difference from the previous workflow.
      #
      # The previous broken IPA contained AltStore.momd but the
      # SideStore binary expected AltStoreCore resources.
      #
      # If AltStoreCore is missing, STOP.
      # ============================================================

      - name: Validate AltStoreCore
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/sidestore/extracted/Payload/SideStore.app"

          echo "=== AltStoreCore ==="

          find "$APP" \
            \( \
              -iname "AltStoreCore.framework" \
              -o \
              -iname "AltStoreCore.bundle" \
            \) \
            -print \
            | sort

          CORE_COUNT=$(
            find "$APP" \
              \( \
                -iname "AltStoreCore.framework" \
                -o \
                -iname "AltStoreCore.bundle" \
              \) \
              -print \
              | wc -l \
              | tr -d ' '
          )

          echo
          echo "AltStoreCore count: $CORE_COUNT"

          if [ "$CORE_COUNT" -eq 0 ]; then
            echo "::error::AltStoreCore.framework / AltStoreCore.bundle not found."
            echo "::error::Refusing to build a potentially broken LC+SideStore IPA."
            exit 1
          fi

      # ============================================================
      # 8. Inspect SideStore executable
      # ============================================================

      - name: Inspect SideStore binary
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/sidestore/extracted/Payload/SideStore.app"

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP/Info.plist"
          )

          BIN="$APP/$EXECUTABLE"

          if [ ! -f "$BIN" ]; then
            echo "::error::SideStore executable not found."
            exit 1
          fi

          echo "Executable: $EXECUTABLE"

          echo
          echo "=== Core Data / AltStoreCore strings ==="

          strings "$BIN" \
            | grep -E \
              'AltStoreCore|NSManagedObjectModel|NSPersistentContainer|managedObjectModel' \
            | sort -u \
            || true

      # ============================================================
      # 9. Copy SideStore locally
      #
      # Official LiveContainer build script will normally download
      # its own SideStore.
      #
      # We patch ONLY that download line.
      #
      # We do NOT rewrite the actual integration logic.
      # ============================================================

      - name: Prepare local SideStore
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "$RUNNER_TEMP/sidestore/SideStore.ipa" \
            "$GITHUB_WORKSPACE/SideStore.ipa"

          test -s "$GITHUB_WORKSPACE/SideStore.ipa"

      # ============================================================
      # 10. Patch official LiveContainer build script
      # ============================================================

      - name: Patch SideStore download
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT=".github/build_github.sh"

          if [ ! -f "$SCRIPT" ]; then
            echo "::error::$SCRIPT not found."
            exit 1
          fi

          cp "$SCRIPT" "$SCRIPT.original"

          python3 <<'PY'
          from pathlib import Path

          path = Path(".github/build_github.sh")
          text = path.read_text()

          targets = [
              "wget https://github.com/LiveContainer/SideStore/releases/download/nightly/SideStore.ipa",
              "wget https://github.com/SideStore/SideStore/releases/download/nightly/SideStore.ipa",
          ]

          replacement = 'cp "$GITHUB_WORKSPACE/SideStore.ipa" ./SideStore.ipa'

          found = False

          for target in targets:
              if target in text:
                  text = text.replace(target, replacement)
                  found = True

          if not found:
              raise SystemExit(
                  "Expected SideStore download command was not found. "
                  "Refusing to modify an unknown build script."
              )

          path.write_text(text)
          PY

          echo "=== Patched build script ==="
          grep -n -E 'SideStore|SideStore\.ipa' "$SCRIPT"

      # ============================================================
      # 11. Build using LiveContainer's official integration
      # ============================================================

      - name: Build LiveContainer + SideStore
        shell: bash
        run: |
          set -euo pipefail

          chmod +x .github/build_github.sh

          .github/build_github.sh

      # ============================================================
      # 12. Find output IPA
      # ============================================================

      - name: Locate final IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "=== IPA files ==="

          find . \
            -type f \
            -name "*.ipa" \
            -print \
            | sort

          FOUND=$(
            find . \
              -type f \
              -name 'LiveContainer+SideStore.ipa' \
              | head -n 1
          )

          if [ -z "$FOUND" ]; then
            echo "::error::LiveContainer+SideStore.ipa was not generated."
            exit 1
          fi

          cp "$FOUND" "$OUTPUT_IPA"

          test -s "$OUTPUT_IPA"

      # ============================================================
      # 13. Extract final IPA
      # ============================================================

      - name: Extract final IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/final"

          mkdir -p "$RUNNER_TEMP/final"

          unzip -q \
            "$OUTPUT_IPA" \
            -d "$RUNNER_TEMP/final"

          APP="$RUNNER_TEMP/final/Payload/LiveContainer.app"

          if [ ! -d "$APP" ]; then
            echo "::error::LiveContainer.app missing from final IPA."
            exit 1
          fi

      # ============================================================
      # 14. Validate embedded SideStore
      # ============================================================

      - name: Validate embedded SideStore
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/final/Payload/LiveContainer.app"
          SS="$APP/Frameworks/SideStoreApp.framework"

          if [ ! -d "$SS" ]; then
            echo "::error::SideStoreApp.framework missing."
            exit 1
          fi

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$SS/Info.plist"
          )

          echo "Bundle ID: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "com.SideStore.SideStore" ]; then
            echo "::error::Unexpected SideStore bundle ID: $BUNDLE_ID"
            exit 1
          fi

      # ============================================================
      # 15. Validate final Core Data resources
      # ============================================================

      - name: Validate final Core Data
        shell: bash
        run: |
          set -euo pipefail

          SS="$RUNNER_TEMP/final/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework"

          echo "=== Final Core Data resources ==="

          find "$SS" \
            \( -name "*.mom" -o -name "*.momd" \) \
            -print \
            | sort

          if ! find "$SS" \
            \( -name "*.mom" -o -name "*.momd" \) \
            | grep -q .; then

            echo "::error::Core Data models disappeared during integration."
            exit 1
          fi

          if ! find "$SS" \
            \( -name "AltStore.mom" -o -name "AltStore.momd" \) \
            | grep -q .; then

            echo "::error::AltStore model disappeared during integration."
            exit 1
          fi

      # ============================================================
      # 16. Validate final AltStoreCore
      # ============================================================

      - name: Validate final AltStoreCore
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/final/Payload/LiveContainer.app"

          echo "=== Final AltStoreCore ==="

          find "$APP" \
            \( \
              -iname "AltStoreCore.framework" \
              -o \
              -iname "AltStoreCore.bundle" \
            \) \
            -print \
            | sort

          CORE_COUNT=$(
            find "$APP" \
              \( \
                -iname "AltStoreCore.framework" \
                -o \
                -iname "AltStoreCore.bundle" \
              \) \
              -print \
              | wc -l \
              | tr -d ' '
          )

          if [ "$CORE_COUNT" -eq 0 ]; then
            echo "::error::AltStoreCore disappeared during integration."
            echo "::error::This build is rejected."
            exit 1
          fi

      # ============================================================
      # 17. Validate SideStore executable
      # ============================================================

      - name: Validate final SideStore executable
        shell: bash
        run: |
          set -euo pipefail

          SS="$RUNNER_TEMP/final/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework"

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$SS/Info.plist"
          )

          BIN="$SS/$EXECUTABLE"

          if [ ! -f "$BIN" ]; then
            echo "::error::SideStore executable missing."
            exit 1
          fi

          echo "=== Relevant binary strings ==="

          strings "$BIN" \
            | grep -E \
              'AltStoreCore|NSManagedObjectModel|NSPersistentContainer|managedObjectModel' \
            | sort -u \
            || true

      # ============================================================
      # 18. Check suspicious nested frameworks
      # ============================================================

      - name: Validate nested frameworks
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/final/Payload/LiveContainer.app"
          SS="$APP/Frameworks/SideStoreApp.framework"

          echo "=== SideStore Frameworks ==="

          if [ -d "$SS/Frameworks" ]; then
            find "$SS/Frameworks" \
              -maxdepth 2 \
              -print \
              | sort
          fi

          echo
          echo "=== Widget Frameworks ==="

          WIDGET="$APP/PlugIns/LiveWidgetExtension.appex"

          if [ -d "$WIDGET/Frameworks" ]; then
            find "$WIDGET/Frameworks" \
              -maxdepth 2 \
              -print \
              | sort
          fi

          if find "$SS" \
            -type d \
            -path '*SideStoreApp.framework/Frameworks/SideStoreApp.framework*' \
            | grep -q .; then

            echo "::error::Recursive SideStoreApp.framework nesting detected."
            exit 1
          fi

      # ============================================================
      # 19. Validate Widget
      # ============================================================

      - name: Validate LiveWidgetExtension
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/final/Payload/LiveContainer.app"
          WIDGET="$APP/PlugIns/LiveWidgetExtension.appex"

          if [ ! -d "$WIDGET" ]; then
            echo "::error::LiveWidgetExtension.appex missing."
            exit 1
          fi

          echo "Widget found."

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$WIDGET/Info.plist"
          )

          echo "Widget Bundle ID: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "com.kdt.livecontainer.LiveWidget" ]; then
            echo "::error::Unexpected Widget bundle ID."
            exit 1
          fi

      # ============================================================
      # 20. Validate LCAppInfo
      # ============================================================

      - name: Validate LCAppInfo
        shell: bash
        run: |
          set -euo pipefail

          SS="$RUNNER_TEMP/final/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework"

          if [ ! -f "$SS/LCAppInfo.plist" ]; then
            echo "::error::LCAppInfo.plist missing."
            exit 1
          fi

          echo "LCAppInfo.plist OK."

      # ============================================================
      # 21. Final package sanity check
      # ============================================================

      - name: Final IPA sanity check
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Final IPA ==="

          unzip -l "$OUTPUT_IPA" \
            | grep -E \
              'SideStoreApp.framework|AltStoreCore|AltStore\.mom|LiveWidgetExtension' \
            | sed -n '1,300p'

          echo
          echo "Final IPA size:"
          du -h "$OUTPUT_IPA"

      # ============================================================
      # 22. SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          shasum -a 256 "$OUTPUT_IPA" \
            | tee "$OUTPUT_IPA.sha256"

      # ============================================================
      # 23. Build information
      # ============================================================

      - name: Generate build information
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "========================================"
            echo "LiveContainer + SideStore Nightly"
            echo "========================================"
            echo

            echo "UTC:"
            date -u
            echo

            echo "LiveContainer:"
            git rev-parse HEAD
            git log -1 --oneline
            echo

            echo "Xcode:"
            xcodebuild -version
            echo

            echo "SideStore URL:"
            echo "$SIDESTORE_URL"
            echo

            echo "SideStore SHA256:"
            shasum -a 256 \
              "$RUNNER_TEMP/sidestore/SideStore.ipa"
            echo

            echo "Final IPA SHA256:"
            shasum -a 256 \
              "$OUTPUT_IPA"
            echo
          } | tee build-info.txt

      # ============================================================
      # 24. Upload
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: LiveContainer+SideStore
          path: |
            LiveContainer+SideStore.ipa
            LiveContainer+SideStore.ipa.sha256
            build-info.txt
          if-no-files-found: error
          retention-days: 30
