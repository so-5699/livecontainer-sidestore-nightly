name: LiveContainer + SideStore (Official develop source build)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    env:
      scheme: LiveContainer
      archive_path: archive

      # 公式SideStoreの最新developブランチ
      SIDESTORE_UPSTREAM_REPO: "https://github.com/SideStore/SideStore.git"
      SIDESTORE_UPSTREAM_BRANCH: develop

    steps:
      # ============================================================
      # 1. LiveContainer チェックアウト
      # ============================================================
      - name: LiveContainer最新版をチェックアウト
        uses: actions/checkout@v4
        with:
          repository: LiveContainer/LiveContainer
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: LiveContainerのコミット情報を表示
        shell: bash
        run: |
          set -euo pipefail
          echo "LiveContainer commit:"
          git rev-parse HEAD
          git log -1 --oneline

      # ============================================================
      # 2. Xcode
      # ============================================================
      - name: Xcodeをセットアップ
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Xcodeバージョンを表示
        run: xcodebuild -version

      # ============================================================
      # 3. プロジェクト判定
      # ============================================================
      - name: Xcodeプロジェクト/ワークスペースを判定
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "LiveContainer.xcworkspace/contents.xcworkspacedata" ]; then
            echo "filetype_parameter=workspace" >> "$GITHUB_OUTPUT"
            echo "file_to_build=LiveContainer.xcworkspace" >> "$GITHUB_OUTPUT"
          elif [ -f "LiveContainer.xcodeproj/project.pbxproj" ]; then
            echo "filetype_parameter=project" >> "$GITHUB_OUTPUT"
            echo "file_to_build=LiveContainer.xcodeproj" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Could not find LiveContainer Xcode project/workspace."
            exit 1
          fi

      # ============================================================
      # 4. LiveContainer ビルド
      # ============================================================
      - name: LiveContainerをアーカイブ
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -"${{ steps.xcode.outputs.filetype_parameter }}" \
            "${{ steps.xcode.outputs.file_to_build }}" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcbeautify

      # ============================================================
      # 5. ツール
      # ============================================================
      - name: 依存ツールをインストール
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid xcbeautify

      # ============================================================
      # 6. 公式SideStore develop をチェックアウト
      # ============================================================
      - name: 公式SideStore developをチェックアウト
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: develop
          submodules: recursive
          fetch-depth: 1
          path: sidestore-upstream

      - name: 公式SideStoreのコミット情報を表示
        shell: bash
        working-directory: sidestore-upstream
        run: |
          set -euo pipefail
          echo "=== Official SideStore develop ==="
          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "=== Core Data / AltStoreCore 構造 ==="
          find . -name "*.xcdatamodeld" -not -path "./.git/*" -print
          find . -iname "AltStoreCore*" -not -path "./.git/*" -print | head -20

      # ============================================================
      # 7. 公式SideStoreをソースからビルド
      #
      # AltStoreCore.framework が動的フレームワークとして
      # 生成され、SideStore.app に埋め込まれることを期待する。
      # ============================================================
      - name: 公式SideStoreをソースからビルド
        shell: bash
        working-directory: sidestore-upstream
        run: |
          set -euo pipefail

          # プロジェクトとスキームを確認
          xcodebuild -list -project AltStore.xcodeproj

          rm -rf SideStore.xcarchive

          xcodebuild \
            -project AltStore.xcodeproj \
            -scheme SideStore \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./SideStore.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # ============================================================
      # 8. SideStore IPA をパッケージ
      # ============================================================
      - name: 公式SideStore IPAを生成
        shell: bash
        working-directory: sidestore-upstream
        run: |
          set -euo pipefail

          rm -rf Payload
          mkdir -p Payload

          cp -R SideStore.xcarchive/Products/Applications/SideStore.app \
                Payload/SideStore.app

          rm -f SideStore.ipa
          (
            cd Payload
            zip -qr ../SideStore.ipa SideStore.app \
              -x "._*" -x ".DS_Store" -x "__MACOSX"
          )

          echo "Generated:"
          ls -lh SideStore.ipa

      # ============================================================
      # 9. ★ 重要: AltStoreCore.framework が含まれているか検証
      #
      # 公式ソースからビルドしても、ビルド設定によっては
      # AltStoreCore が動的フレームワークとして埋め込まれない
      # 可能性がある。ここで確認する。
      # ============================================================
      - name: ビルド済みSideStoreのAltStoreCoreを検証
        shell: bash
        working-directory: sidestore-upstream
        run: |
          set -euo pipefail

          rm -rf verify
          mkdir verify
          unzip -q SideStore.ipa -d verify

          APP="verify/SideStore.app"
          test -d "$APP"

          echo "=== SideStore.app 直下 ==="
          ls -la "$APP"

          echo
          echo "=== AltStoreCore* ==="
          find "$APP" -iname "AltStoreCore*" -print || true

          echo
          echo "=== *.momd ==="
          find "$APP" \( -name "*.momd" -o -name "*.mom" \) -print

          # AltStoreCore の有無を記録（後のステップで参照）
          if find "$APP" -iname "AltStoreCore.framework" -type d -print -quit | grep -q .; then
            echo "ALTSTORE_CORE_PRESENT=framework" >> "$GITHUB_ENV"
            echo "AltStoreCore.framework found."
          elif find "$APP" -iname "AltStoreCore.bundle" -type d -print -quit | grep -q .; then
            echo "ALTSTORE_CORE_PRESENT=bundle" >> "$GITHUB_ENV"
            echo "AltStoreCore.bundle found."
          else
            echo "ALTSTORE_CORE_PRESENT=missing" >> "$GITHUB_ENV"
            echo "WARNING: AltStoreCore.{framework,bundle} not found in built SideStore.app."
            echo "Will attempt injection later."
          fi

          # .momd の存在は必須
          if ! find "$APP" \( -name "*.momd" -o -name "*.mom" \) -print -quit | grep -q .; then
            echo "ERROR: No Core Data models found in built SideStore.app."
            exit 1
          fi

      # ============================================================
      # 10. build_github.sh をローカルSideStore用にパッチ
      # ============================================================
      - name: LiveContainer統合スクリプトをローカルSideStore用に変更
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT=".github/build_github.sh"
          test -f "$SCRIPT"

          # 公式ソースからビルドした IPA をカレントに配置
          cp sidestore-upstream/SideStore.ipa ./SideStore.ipa
          ls -lh ./SideStore.ipa

          echo "=== 元の SideStore ダウンロード行 ==="
          grep -n "SideStore.ipa" "$SCRIPT" || true

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(".github/build_github.sh")
          text = path.read_text()

          pattern = re.compile(
              r"(?m)^[^\n]*(?:wget|curl)[^\n]*SideStore\.ipa[^\n]*$"
          )
          matches = list(pattern.finditer(text))
          if not matches:
              raise SystemExit(
                  "ERROR: SideStore ダウンロードコマンドが見つかりません。"
              )

          def repl(_m):
              return (
                  'test -f SideStore.ipa\n'
                  'echo "Using locally built SideStore.ipa"\n'
                  'ls -lh SideStore.ipa'
              )

          new_text, count = pattern.subn(repl, text, count=1)
          path.write_text(new_text)
          print(f"Patched {count} command(s).")
          PY

          echo
          echo "=== パッチ後 ==="
          grep -n -A2 -B2 "Using locally built SideStore" "$SCRIPT"

          if grep -E "(wget|curl).*SideStore\.ipa" "$SCRIPT"; then
            echo "ERROR: リモートダウンロードが残っています。"
            exit 1
          fi

      # ============================================================
      # 11. 公式統合スクリプト実行
      # ============================================================
      - name: 公式LiveContainer統合処理を実行
        shell: bash
        run: |
          set -euo pipefail
          sh .github/build_github.sh

      # ============================================================
      # 12. 生成IPA確認
      # ============================================================
      - name: 生成された統合版IPAを確認
        shell: bash
        run: |
          set -euo pipefail
          test -f "LiveContainer+SideStore.ipa"
          ls -lh "LiveContainer+SideStore.ipa"

      - name: 統合版IPAを展開
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-final
          mkdir -p verify-final
          unzip -q "LiveContainer+SideStore.ipa" -d verify-final

      # ============================================================
      # 13. ★ 最終IPAで AltStoreCore を検証
      #
      # 公式ソースビルドでも AltStoreCore が欠落している場合、
      # ここで検出する。欠落していれば SideStore.app から
      # AltStoreCore.framework を回収して注入する。
      # ============================================================
      - name: 最終IPAでAltStoreCoreを検証・必要なら注入
        shell: bash
        run: |
          set -euo pipefail

          APP="verify-final/Payload/LiveContainer.app"
          FW="$APP/Frameworks/SideStoreApp.framework"

          echo "=== SideStoreApp.framework 直下 ==="
          find "$FW" -maxdepth 2 -print | sort

          echo
          echo "=== AltStoreCore* の場所 ==="
          find "$APP" -iname "AltStoreCore*" -print || true

          CORE=$(find "$APP" \( -iname "AltStoreCore.framework" -o -iname "AltStoreCore.bundle" \) -type d -print -quit || true)

          if [ -n "$CORE" ]; then
            echo "AltStoreCore already present: $CORE"
          else
            echo
            echo "=== AltStoreCore が最終IPAに存在しない → 注入を試みる ==="

            # 公式ソースビルドの SideStore.app から AltStoreCore を探す
            ORIG_APP="sidestore-upstream/verify/SideStore.app"
            ORIG_CORE=$(find "$ORIG_APP" \( -iname "AltStoreCore.framework" -o -iname "AltStoreCore.bundle" \) -type d -print -quit || true)

            if [ -z "$ORIG_CORE" ]; then
              echo "FATAL: 元の SideStore.app にも AltStoreCore が見つかりません。"
              echo "公式 develop のビルド設定で AltStoreCore が"
              echo "動的フレームワークとして生成されていません。"
              find "$ORIG_APP" -maxdepth 3 -type d | sort
              exit 1
            fi

            CORE_NAME=$(basename "$ORIG_CORE")
            echo "Found in original: $ORIG_CORE"

            # SideStoreApp.framework/Frameworks/ に配置
            mkdir -p "$FW/Frameworks"
            rm -rf "$FW/Frameworks/$CORE_NAME"
            cp -R "$ORIG_CORE" "$FW/Frameworks/$CORE_NAME"

            # LiveContainer.app/Frameworks/ にも配置
            rm -rf "$APP/Frameworks/$CORE_NAME"
            cp -R "$ORIG_CORE" "$APP/Frameworks/$CORE_NAME"

            # ldid で再署名
            if [ -f "$FW/Frameworks/$CORE_NAME/AltStoreCore" ]; then
              ldid -S "$FW/Frameworks/$CORE_NAME/AltStoreCore" || true
              ldid -S "$APP/Frameworks/$CORE_NAME/AltStoreCore" || true
            fi

            # 注入後の検証
            if ! find "$FW/Frameworks/$CORE_NAME" \( -name "*.momd" -o -name "*.mom" \) -print -quit | grep -q .; then
              echo "FATAL: 注入した $CORE_NAME に Core Data モデルがありません。"
              exit 1
            fi

            echo "AltStoreCore injected: $FW/Frameworks/$CORE_NAME"

            # IPA を再パッケージ
            echo
            echo "=== IPAを再パッケージ ==="
            rm -rf payload-work
            mkdir -p payload-work
            cp -R verify-final/Payload payload-work/

            rm -f "LiveContainer+SideStore.ipa"
            (
              cd payload-work
              zip -qr ../LiveContainer+SideStore.ipa Payload \
                -x "._*" -x ".DS_Store" -x "__MACOSX"
            )

            # 再展開して検証
            rm -rf verify-final
            mkdir -p verify-final
            unzip -q "LiveContainer+SideStore.ipa" -d verify-final

            CORE=$(find "verify-final/Payload/LiveContainer.app" \( -iname "AltStoreCore.framework" -o -iname "AltStoreCore.bundle" \) -type d -print -quit || true)
            if [ -z "$CORE" ]; then
              echo "FATAL: 再パッケージ後も AltStoreCore が見つかりません。"
              exit 1
            fi
            echo "Re-verification OK: $CORE"
          fi

          # 最終確認
          CORE=$(find "verify-final/Payload/LiveContainer.app" \( -iname "AltStoreCore.framework" -o -iname "AltStoreCore.bundle" \) -type d -print -quit || true)
          if [ -z "$CORE" ]; then
            echo "FATAL: AltStoreCore が最終IPAに存在しません。"
            exit 1
          fi

          if ! find "$CORE" \( -name "*.momd" -o -name "*.mom" \) -print -quit | grep -q .; then
            echo "FATAL: $CORE に Core Data モデルがありません。"
            exit 1
          fi

          echo
          echo "AltStoreCore / Core Data の存在を最終IPAで確認しました。"

      # ============================================================
      # 14. その他検証
      # ============================================================
      - name: SideStore frameworkを検証
        shell: bash
        run: |
          set -euo pipefail
          FW="verify-final/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework"
          test -d "$FW"
          test -f "$FW/SideStore"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$FW/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$FW/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$FW/Info.plist"

      - name: LiveWidgetExtensionを検証
        shell: bash
        run: |
          set -euo pipefail
          WIDGET="verify-final/Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex"
          test -d "$WIDGET"
          test -f "$WIDGET/LiveWidgetExtension"

      # ============================================================
      # 15. 出力
      # ============================================================
      - name: SHA256を計算
        shell: bash
        run: shasum -a 256 "LiveContainer+SideStore.ipa"

      - name: ビルド情報を作成
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "LiveContainer + SideStore (Official develop source build)"
            echo
            echo "## LiveContainer"
            git rev-parse HEAD
            git log -1 --oneline
            echo
            echo "## Xcode"
            xcodebuild -version
            echo
            echo "## SideStore (official develop)"
            cd sidestore-upstream
            git rev-parse HEAD
            git log -1 --oneline
            cd ..
            echo
            echo "## SideStore bundle in final IPA"
            FW="verify-final/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$FW/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$FW/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$FW/Info.plist"
            echo
            echo "## SHA256"
            shasum -a 256 "LiveContainer+SideStore.ipa"
          } > build-info.txt
          cat build-info.txt

      - name: アップロード
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-plus-SideStore
          path: LiveContainer+SideStore.ipa
          if-no-files-found: error
          retention-days: 7

      - name: ビルド情報をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt
          if-no-files-found: error
          retention-days: 7

      - name: ジョブサマリーを出力
        shell: bash
        run: |
          {
            echo "## LiveContainer + SideStore (Official develop source build)"
            echo
            echo "### LiveContainer"
            echo '```'
            git log -1 --oneline
            echo '```'
            echo
            echo "### SideStore upstream"
            echo '```'
            cd sidestore-upstream
            git log -1 --oneline
            cd ..
            echo '```'
            echo
            echo "### Build information"
            echo '```'
            cat build-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
